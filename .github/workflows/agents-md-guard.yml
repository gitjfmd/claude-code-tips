name: agents-md-guard

# AGENTS.md at the repo root is the only hand-edited agent rules file; QWEN.md,
# WARP.md, .clinerules/00-central-command-rules.md, .github/copilot-instructions.md
# (and GEMINI.md when present) are byte copies, and CLAUDE.md is the stub
# "@AGENTS.md" unless .agents-md-guard-exceptions lists it. Only a branch named
# agents-md-update-* may change them or the guard's own control files (CEO 2026-11-18).
# Logic and cases: scripts/agents-md-guard.sh, executed from the protected base ref.
#
# The CEO decided (2026-11-18) this check is REQUIRED in branch protection, so there is
# deliberately no `paths:` filter: a required check that a paths filter skips never
# reports and blocks the PR.

on:
  pull_request:

permissions:
  contents: read

jobs:
  agents-md-guard:
    name: agents-md-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_REF: ${{ github.base_ref }}
      ORIGIN_REPO: ${{ github.repository }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      PR_ACTOR: ${{ github.event.pull_request.user.login }}
      AGENTS_MD_AUTHORIZED_ACTORS: ${{ vars.AGENTS_MD_AUTHORIZED_ACTORS || 'gitjfmd' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # branch-gate diffs <base>...HEAD, which needs the merge base
          persist-credentials: false

      - name: extract the guard from the protected base
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CENTRAL_COMMAND_READ_PAT: ${{ secrets.CENTRAL_COMMAND_READ_PAT }}
        run: |
          git -c credential.helper= \
            -c 'credential.helper=!f() { echo username=x-access-token; echo password="$GITHUB_TOKEN"; }; f' \
            fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          if git cat-file -e "origin/$BASE_REF:scripts/agents-md-guard.sh" 2>/dev/null; then
            git show "origin/$BASE_REF:scripts/agents-md-guard.sh" > "$RUNNER_TEMP/agents-md-guard.sh"
          else
            git -c credential.helper= \
              -c 'credential.helper=!f() { echo username=x-access-token; echo password="$CENTRAL_COMMAND_READ_PAT"; }; f' \
              fetch --no-tags https://github.com/gitjfmd/central-command.git \
              "+refs/heads/dev:refs/remotes/central-command/dev"
            git show "central-command/dev:scripts/agents-md-guard.sh" > "$RUNNER_TEMP/agents-md-guard.sh"
          fi
          chmod +x "$RUNNER_TEMP/agents-md-guard.sh"

      - name: selftest
        run: '"$RUNNER_TEMP/agents-md-guard.sh" selftest'

      - name: copies match AGENTS.md, CLAUDE.md is the stub or excepted
        run: '"$RUNNER_TEMP/agents-md-guard.sh" check --canary'

      - name: only agents-md-update-* with trusted provenance may change protected files
        run: '"$RUNNER_TEMP/agents-md-guard.sh" branch-gate "origin/$BASE_REF"'
